<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DevBench - 开发者与测试人员工具箱" />
    <title>DevBench</title>
    <script>
      // 首屏渲染前应用已保存的主题，避免刷新时先闪浅色
      (function () {
        try {
          var prefs = JSON.parse(localStorage.getItem('devbench.preferences') || '{}');
          document.documentElement.setAttribute(
            'data-theme',
            prefs.theme === 'dark' ? 'dark' : 'light',
          );
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
